input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  if [datetime] {
    date {
      match => ["datetime", "ISO8601"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  if [level] {
    mutate {
      uppercase => ["level"]
      add_field => { "level_name" => "%{level}" }
    }
  } else if [level_name] {
    mutate { uppercase => ["level_name"] }
  }

  ruby {
    code => "event.set('parsed_at', Time.now.utc.iso8601)"
  }

  if [client_ip] {
    geoip { source => "client_ip" target => "geo" }
  }

  # Derive a routing prefix from the service tag; anything unrecognised
  # falls back to "unknown" so the output section stays branchless.
  mutate {
    add_field => { "log_index_prefix" => "%{[fields][service]}" }
  }
  if [log_index_prefix] not in ["transaction-api", "fraud-service", "account-service"] {
    mutate { replace => { "log_index_prefix" => "unknown" } }
  }

  if ![application] {
    mutate { add_field => { "application" => "unknown-app" } }
  }

  if ![environment] {
    mutate { add_field => { "environment" => "unknown-env" } }
  }
}

output {
  if [log_index_prefix] == "unknown" {
    # Unknown service — routes here for inspection, not silently dropped
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "unknown-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "%{log_index_prefix}-%{[application]}-%{[environment]}-logs-%{+YYYY.MM.dd}"
    }
  }
}
