input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  if [datetime] {
    date {
      match => ["datetime", "ISO8601"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  if [level] {
    mutate {
      uppercase => ["level"]
      add_field => { "level_name" => "%{level}" }
    }
  } else if [level_name] {
    mutate { uppercase => ["level_name"] }
  }

  ruby {
    code => "event.set('parsed_at', Time.now.utc.iso8601)"
  }

  if [client_ip] {
    geoip { source => "client_ip" target => "geo" }
  }
}

output {
  if [fields][service] == "springboot" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "springboot-%{[application]}-%{[environment]}-logs-%{+YYYY.MM.dd}"
    }
  } else if [fields][service] == "laravel" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "laravel-%{[application]}-%{[environment]}-logs-%{+YYYY.MM.dd}"
    }
  } else if [fields][service] == "nodejs" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "nodejs-%{[application]}-%{[environment]}-logs-%{+YYYY.MM.dd}"
    }
  } else {
    # Unknown service — routes here for inspection, not silently dropped
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "unknown-logs-%{+YYYY.MM.dd}"
    }
  }
}
