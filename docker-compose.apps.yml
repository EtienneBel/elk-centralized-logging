services:
  fraud-service:
    build:
      context: ./apps/fraud-service
    container_name: fraud-service
    volumes:
      - ./logs/fraud-service:/app/logs
    ports:
      - "8080:8080"
    networks:
      - logging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  account-service:
    build:
      context: ./apps/account-service
    container_name: account-service
    environment:
      - APP_ENV=production
      - LOG_CHANNEL=elk
    volumes:
      - ./logs/account-service:/app/storage/logs
    ports:
      - "8000:8000"
    networks:
      - logging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  transaction-api:
    build:
      context: ./apps/transaction-api
    container_name: transaction-api
    environment:
      - NODE_ENV=production
      - APP_NAME=transaction-api
      - LOG_DIR=/app/logs
      - FRAUD_SERVICE_URL=http://fraud-service:8080
      - ACCOUNT_SERVICE_URL=http://account-service:8000
      - PORT=3000
    volumes:
      - ./logs/transaction-api:/app/logs
    ports:
      - "3000:3000"
    networks:
      - logging-network
    depends_on:
      fraud-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  logging-network:
    external: true
