services:
  billing-api:
    build:
      context: ./apps/billing-api
    container_name: billing-api
    environment:
      - LOG_CHANNEL=elk
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./logs/billing-api:/var/www/html/storage/logs
    ports:
      - "8000:8000"
    networks:
      - logging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./apps/auth-service
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - BILLING_SERVICE_URL=http://billing-api:8000
    volumes:
      - ./logs/auth-service:/app/logs
    ports:
      - "8080:8080"
    networks:
      - logging-network
    depends_on:
      billing-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  notification-api:
    build:
      context: .
      dockerfile: apps/notification-api/Dockerfile
    container_name: notification-api
    environment:
      - APP_NAME=notification-api
      - NODE_ENV=production
      - LOG_DIR=/app/logs
      - AUTH_SERVICE_URL=http://auth-service:8080
    volumes:
      - ./logs/notification-api:/app/logs
    ports:
      - "3000:3000"
    networks:
      - logging-network
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  logging-network:
    external: true
